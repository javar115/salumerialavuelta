<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salumería La Vuelta</title>
<meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--c:#a8101c;--o:#e0a526;--bg:#faf4e4;--t:#1a1a1a}
*{box-sizing:border-box}
body{margin:0;font:18px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:80px}
header{background:#000;color:#f6e7bd;padding:8px 14px;font-weight:700;font-size:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--o)}header img{height:52px;width:52px;vertical-align:middle;margin-right:10px}.logo{display:block;width:220px;max-width:70%;margin:10px auto}
main{max-width:720px;margin:auto;padding:14px}
button,select,input,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #bbb;width:100%;margin:4px 0}
button{background:var(--c);color:#fff;border:0;font-weight:600;cursor:pointer;width:auto}
button.s{background:#eee;color:#222}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0002}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #ccc}
nav button{flex:1;border-radius:0;background:#fff;color:#222;font-size:15px;margin:0}
nav button.on{background:var(--c);color:#fff}
.aviso{background:#fff3cd;padding:8px;border-radius:8px;font-size:15px}
.b{display:inline-block;background:#eee;color:#222;padding:12px;border-radius:10px;font-weight:600;cursor:pointer;margin:4px 0}.th{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}.g{display:flex;gap:10px;align-items:center}
@media print{nav,header button,.np{display:none}}
</style></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SB_URL='https://bsstgsxmhbuytatgofif.supabase.co', SB_KEY='sb_publishable_WuHvzOxIscpyfZC9ISvZww_tOhulHZh';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), app=$('#app');
const S={user:null,perfil:null,tab:'prod',cats:[],marcas:[],prods:[],cat:0,marca:0,ped:null,items:[]};
const money=n=>'$'+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opts=(a,sel,all)=>(all?`<option value="0">${all}</option>`:'')+a.map(x=>`<option value="${x.id}" ${sel==x.id?'selected':''}>${esc(x.nombre)}</option>`).join('');
const total=p=>p.pedido_items.reduce((a,i)=>a+i.precio*i.cantidad,0);

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return login();
  S.user=session.user;
  const {data:p}=await sb.from('perfiles').select('*').eq('id',S.user.id).maybeSingle();
  if(!p)return alta();
  S.perfil=p; await cargar(); render();
}
function login(){app.innerHTML=`<header><span><img src="logo.png" alt="">Salumería La Vuelta</span></header><main><img class="logo" src="logo.png" alt="Tienda virtual La Vuelta"><div class="card"><h2>Bienvenido</h2><p>Entrá con tu cuenta de Google para hacer tu pedido.</p><button onclick="sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}})">Entrar con Google</button></div></main>`}
async function alta(){
  const r=await Promise.all(['provincias','zonas','partidos','localidades'].map(t=>sb.from(t).select('*').order('nombre')));
  S.U={prov:r[0].data||[],zona:r[1].data||[],part:r[2].data||[],loc:r[3].data||[]};
  app.innerHTML=`<header><span><img src="logo.png" alt="">Salumería La Vuelta</span></header><main><div class="card"><h2>Tus datos</h2><input id="n" placeholder="Nombre completo"><input id="d" placeholder="Dirección (calle y número)"><select id="up" onchange="cas('up')"></select><select id="uz" onchange="cas('uz')"></select><select id="ua" onchange="cas('ua')"></select><select id="ul"></select><input id="t" placeholder="Teléfono" type="tel"><input id="w" placeholder="WhatsApp" type="tel"><button onclick="guardar()">Guardar y continuar</button></div></main>`;
  cas('init');
}
function cas(from){
  const U=S.U,v=i=>+$('#'+i).value||0;
  const fill=(id,list,lab)=>{const e=$('#'+id);e.innerHTML=`<option value="0">${lab}</option>`+list.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('');e.style.display=list.length?'':'none'};
  if(from=='init')fill('up',U.prov,'Provincia');
  if(from=='init'||from=='up')fill('uz',U.zona.filter(z=>z.provincia_id==v('up')),'Zona');
  if(from!='ua')fill('ua',U.part.filter(p=>p.zona_id==v('uz')),'Partido');
  fill('ul',U.loc.filter(l=>l.partido_id==v('ua')),'Localidad');
}
async function guardar(){
  const g=i=>$('#'+i).value.trim(),v=i=>+$('#'+i).value||null;
  if(!g('n')||!g('d')||!g('w'))return alert('Completá nombre, dirección y WhatsApp');
  for(const [i,n] of [['up','la provincia'],['uz','la zona'],['ua','el partido'],['ul','la localidad']])if($('#'+i).style.display!='none'&&!v(i))return alert('Elegí '+n);
  const {error}=await sb.from('perfiles').insert({id:S.user.id,email:S.user.email,nombre_completo:g('n'),direccion:g('d'),telefono:g('t'),whatsapp:g('w'),provincia_id:v('up'),zona_id:v('uz'),partido_id:v('ua'),localidad_id:v('ul')});
  if(error)return alert(error.message); init();
}
async function cargar(){
  const [c,m,p]=await Promise.all([sb.from('categorias').select('*').order('orden'),sb.from('marcas').select('*').order('nombre'),sb.from('productos').select('*').order('orden').order('nombre')]);
  S.cats=c.data||[];S.marcas=m.data||[];S.prods=p.data||[];
  await cargarPed();
}
async function cargarPed(){
  const {data}=await sb.from('pedidos').select('*').eq('persona_id',S.user.id).eq('estado','borrador').order('created_at',{ascending:false}).limit(1);
  S.ped=data?.[0]||null;S.items=[];
  if(S.ped){const r=await sb.from('pedido_items').select('*').eq('pedido_id',S.ped.id).order('nombre');S.items=r.data||[];}
}
function render(){
  const tabs=[['prod','Productos'],['ped','Mi pedido'],['hist','Pedidos'],['cat','Catálogos'],...(S.perfil.es_admin?[['adm','Admin']]:[])];
  app.innerHTML=`<header><span><img src="logo.png" alt="">La Vuelta</span><button class="s" onclick="sb.auth.signOut().then(()=>location.reload())">Salir</button></header><main id="v"></main><nav>${tabs.map(([k,n])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${n}${k=='ped'&&S.items.length?' ('+S.items.length+')':''}</button>`).join('')}</nav>`;
  ({prod:vProd,ped:vPed,hist:vHist,cat:vCat,adm:vAdm})[S.tab]();
}
function vProd(){
  const ps=S.prods.filter(p=>p.activo&&(!S.cat||p.categoria_id==S.cat)&&(!S.marca||p.marca_id==S.marca));
  const mn=id=>S.marcas.find(m=>m.id==id)?.nombre||'';
  $('#v').innerHTML=`<div class="aviso">Los precios incluyen IVA.</div>
  <select onchange="S.cat=+this.value;render()">${opts(S.cats,S.cat,'Todas las categorías')}</select>
  <select onchange="S.marca=+this.value;render()">${opts(S.marcas,S.marca,'Todas las marcas')}</select>
  ${ps.map(p=>`<div class="card row"><div class="g">${p.foto_url?`<img class="th" loading="lazy" src="${esc(p.foto_url)}" alt="">`:''}<div><small>Cód. ${esc(p.codigo)}</small><br><b>${esc(p.nombre)}</b><br>${esc(mn(p.marca_id))} · ${esc(p.unidad)}<br>${money(p.precio)}</div></div><button onclick="agregar(${p.id})">Agregar</button></div>`).join('')||'<p>No hay productos.</p>'}`;
}
async function agregar(id){
  const p=S.prods.find(x=>x.id==id);
  if(!S.ped){const {data,error}=await sb.from('pedidos').insert({persona_id:S.user.id}).select().single();if(error)return alert(error.message);S.ped=data;}
  const it=S.items.find(i=>i.producto_id==id);
  if(it)await sb.from('pedido_items').update({cantidad:it.cantidad+1}).eq('id',it.id);
  else await sb.from('pedido_items').insert({pedido_id:S.ped.id,producto_id:id,codigo:p.codigo,nombre:p.nombre,unidad:p.unidad,precio:p.precio,cantidad:1});
  await cargarPed();render();
}
async function cant(id,d){
  const it=S.items.find(i=>i.id==id),n=it.cantidad+d;
  if(n<1)await sb.from('pedido_items').delete().eq('id',id);else await sb.from('pedido_items').update({cantidad:n}).eq('id',id);
  await cargarPed();render();
}
function vPed(){
  const t=S.items.reduce((a,i)=>a+i.precio*i.cantidad,0);
  $('#v').innerHTML=S.items.length?`<div class="aviso">Precios con IVA incluido. Podés cambiar las cantidades antes de enviar.</div>${S.items.map(i=>`<div class="card row"><div><small>Cód. ${esc(i.codigo)}</small><br><b>${esc(i.nombre)}</b><br>${esc(i.unidad)} · ${money(i.precio)}</div><div><button class="s" onclick="cant('${i.id}',-1)">−</button> <b>${i.cantidad}</b> <button class="s" onclick="cant('${i.id}',1)">+</button></div></div>`).join('')}<h3>Total aproximado: ${money(t)}</h3><textarea id="notas" placeholder="Comentarios (opcional)">${esc(S.ped.notas)}</textarea><button onclick="cerrar('enviado')">ENVIAR PEDIDO</button> <button class="s" onclick="cerrar('cancelado')">Cancelar pedido</button>`:'<p>Todavía no agregaste productos.</p>';
}
async function cerrar(e){
  if(e=='enviado'&&!confirm('¿Enviar el pedido? Después no se podrá modificar.'))return;
  if(e=='cancelado'&&!confirm('¿Cancelar el pedido?'))return;
  const {error}=await sb.from('pedidos').update({estado:e,notas:$('#notas')?.value||null}).eq('id',S.ped.id);
  if(error)return alert(error.message);
  S.tab='hist';await cargarPed();render();
}
const detalle=(p,x='')=>`<div class="card"><div class="row"><b>${p.numero||'(sin número)'}</b><span>${p.estado.toUpperCase()}</span></div><small>${new Date(p.enviado_at||p.created_at).toLocaleString('es-AR')}</small>${x}<ul>${p.pedido_items.map(i=>`<li>${i.cantidad} × ${esc(i.nombre)} (${esc(i.unidad)}) · Cód. ${esc(i.codigo)}</li>`).join('')}</ul>${p.notas?`<p><i>${esc(p.notas)}</i></p>`:''}<b>Total: ${money(total(p))}</b> <small>IVA incluido</small><br><button class="s np" onclick="window.print()">Imprimir / guardar PDF</button>${p.estado=='cancelado'&&!x?` <button class="s np" onclick="borrarMio('${p.id}')">Eliminar pedido</button>`:''}</div>`;
async function vHist(){
  const {data}=await sb.from('pedidos').select('*,pedido_items(*)').eq('persona_id',S.user.id).neq('estado','borrador').order('created_at',{ascending:false});
  $('#v').innerHTML=(data||[]).map(p=>detalle(p)).join('')||'<p>Todavía no enviaste pedidos.</p>';
}
async function vCat(){
  const {data}=await sb.from('catalogos').select('*').order('nombre');
  $('#v').innerHTML=(data||[]).map(c=>`<div class="card"><a href="${esc(c.url)}" target="_blank">${esc(c.nombre)}</a></div>`).join('')||'<p>Todavía no hay catálogos.</p>';
}
async function vAdm(){
  const {data}=await sb.from('pedidos').select('*,perfiles(nombre_completo,direccion,telefono,whatsapp,provincias(nombre),zonas(nombre),partidos(nombre),localidades(nombre)),pedido_items(*)').neq('estado','borrador').order('created_at',{ascending:false});
  const x=p=>{const f=p.perfiles||{};return `<br>${esc(f.nombre_completo)} · ${esc(f.direccion)}<br>${esc([f.localidades?.nombre,f.partidos?.nombre,f.zonas?.nombre,f.provincias?.nombre].filter(Boolean).join(', '))}<br>Tel ${esc(f.telefono)} · WhatsApp ${esc(f.whatsapp)}<br><select class="np" onchange="estado('${p.id}',this.value)">${['enviado','entregado','cancelado'].map(e=>`<option ${p.estado==e?'selected':''}>${e}</option>`).join('')}</select> <button class="s np" onclick="borrar('${p.id}')">Eliminar</button>`};
  $('#v').innerHTML=`<h2>Pedidos recibidos</h2>${(data||[]).map(p=>detalle(p,x(p))).join('')||'<p>Sin pedidos.</p>'}
  <h2>Agregar producto</h2><div class="card"><input id="pc" placeholder="Código (ej. Q0001A)"><select id="pk">${opts(S.cats,0,'Categoría')}</select><select id="pm">${opts(S.marcas,0,'Marca')}</select><input id="pf" placeholder="Familia"><input id="pn" placeholder="Producto"><input id="pu" placeholder="Unidad (ej. 100 g)"><input id="pp" type="number" step="0.01" placeholder="Precio con IVA"><button onclick="addProd()">Guardar producto</button></div>
  <h2>Importar desde Excel</h2><div class="card"><p>Acepta tu planilla de consumidor final (ID, CODIGO, T, MARCA, FAMILIA, PRODUCTO, PESO KG/UN, $/KG FINAL): el precio de cada unidad es peso × precio por kg final, y los productos con peso 0 quedan ocultos. También acepta columnas simples: Código, Marca, Familia, Producto, Unidad, Precio. Si el código ya existe, se actualiza.</p><input type="file" accept=".xlsx,.xls,.csv" onchange="importar(this)"></div>
  <button class="s" onclick="addAux('categorias')">+ Categoría</button> <button class="s" onclick="addAux('marcas')">+ Marca</button>
  <h2>Fotos de productos</h2><div class="card"><p>Para subir muchas a la vez, nombrá cada archivo con el código del producto (ej. <b>Q5102A.jpg</b> o <b>Q5102.jpg</b>: la letra final es opcional). También podés subir una sola desde cada producto, más abajo.</p><input type="file" multiple accept="image/*" onchange="subirFotos(this.files)"></div><h2>Productos</h2>${S.prods.map(p=>`<div class="card row"><div>${esc(p.codigo)} · ${esc(p.nombre)}<br>${esc(p.unidad)} · ${money(p.precio)} ${p.activo?'':'(oculto)'}</div><div><label class="b">${p.foto_url?'Cambiar foto':'Foto'}<input type="file" accept="image/*" hidden onchange="subirFotos(this.files,${p.id})"></label> <button class="s" onclick="precio(${p.id})">Precio</button> <button class="s" onclick="prodUp(${p.id},{activo:${!p.activo}})">${p.activo?'Ocultar':'Mostrar'}</button></div></div>`).join('')}`;
}
async function estado(id,e){const {error}=await sb.from('pedidos').update({estado:e}).eq('id',id);if(error)alert(error.message)}
async function borrar(id){if(confirm('¿Eliminar este pedido?')){await sb.from('pedidos').delete().eq('id',id);render()}}
async function addAux(t){const n=prompt('Nombre:');if(!n)return;const {error}=await sb.from(t).insert({nombre:n});if(error)return alert(error.message);await cargar();render()}
async function addProd(){
  const g=i=>$('#'+i).value.trim();
  const {error}=await sb.from('productos').insert({codigo:g('pc'),categoria_id:+g('pk')||null,marca_id:+g('pm')||null,familia:g('pf'),nombre:g('pn'),unidad:g('pu'),precio:+g('pp')});
  if(error)return alert(error.message);await cargar();render();
}
async function prodUp(id,c){await sb.from('productos').update(c).eq('id',id);await cargar();render()}
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const num=v=>typeof v=='number'?v:parseFloat(String(v).replace(/[$\s]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));
async function importar(inp){
  const f=inp.files[0];if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer());
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const g=(r,...k)=>{for(const key in r)if(k.includes(norm(key)))return r[key];return ''};
    const letra={q:'Quesos',c:'Chacinados',e:'Encurtidos'};
    const cats=new Map(S.cats.map(c=>[norm(c.nombre),c.id])),mar=new Map(S.marcas.map(m=>[norm(m.nombre),m.id]));
    const gid=async(map,t,n)=>{n=String(n).trim();if(!n)return null;const k=norm(n);if(!map.has(k)){const {data,error}=await sb.from(t).insert({nombre:n}).select().single();if(error)throw error;map.set(k,data.id)}return map.get(k)};
    const out=new Map();let omit=0;
    for(const r of rows){
      let codigo,nombre=String(g(r,'producto','nombre','descripcion')).trim(),precio,unidad,activo=true,cn;
      if(g(r,'$/kg final')!==''||g(r,'peso kg/un')!==''){
        const id=String(g(r,'id')).trim().toUpperCase(),t=String(g(r,'t')).trim().toUpperCase(),n=num(g(r,'codigo')),peso=num(g(r,'peso kg/un'))||0;
        codigo=isNaN(n)?'':id+String(Math.round(n)).padStart(4,'0')+t;
        activo=peso>0;
        unidad=activo?(peso<1?Math.round(peso*1000)+' g':peso+' kg'):'a definir';
        precio=activo?Math.round(peso*num(g(r,'$/kg final'))*100)/100:0;
        cn=letra[id.toLowerCase()]||'';
      }else{
        codigo=String(g(r,'codigo','id','cod')).trim();precio=num(g(r,'precio','precio con iva','precio final'));
        unidad=String(g(r,'unidad','unidad de medida','presentacion')).trim()||'1 unidad';
        cn=String(g(r,'categoria'))||letra[codigo[0]?.toLowerCase()]||'';
      }
      if(!codigo||!nombre||!(precio>=0)){omit++;continue}
      out.set(codigo,{codigo,nombre,precio,categoria_id:await gid(cats,'categorias',cn),marca_id:await gid(mar,'marcas',g(r,'marca')),familia:String(g(r,'familia')).trim(),unidad,activo});
    }
    const lista=[...out.values()];
    for(let i=0;i<lista.length;i+=200){const {error}=await sb.from('productos').upsert(lista.slice(i,i+200),{onConflict:'codigo'});if(error)throw error}
    alert('Productos importados: '+lista.length+' ('+lista.filter(x=>x.activo).length+' a la venta, el resto oculto)'+(omit?'. Filas omitidas (sin código, producto o precio): '+omit:''));
    await cargar();render();
  }catch(e){alert('No se pudo importar: '+(e.message||e))}
}
const redim=f=>new Promise((ok,ko)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):ko(new Error('imagen inválida')),'image/jpeg',.8)};im.onerror=()=>ko(new Error('no se pudo leer'));im.src=URL.createObjectURL(f)});
const clave=n=>{const b=n.replace(/\.[^.]+$/,'').replace(/[^a-z0-9]/gi,'').toUpperCase(),m=b.match(/^([A-Z])(\d{1,4})([A-Z]?)$/);return m?m[1]+m[2].padStart(4,'0')+m[3]:b};
async function subirFotos(files,id){
  let ok=0;const mal=[];
  for(const f of files){
    const k=clave(f.name);
    const ps=id?S.prods.filter(x=>x.id==id):S.prods.filter(x=>{const c=x.codigo.toUpperCase();return c==k||(k.length==5&&c.slice(0,5)==k)});
    if(!ps.length){mal.push(f.name+' (código no encontrado)');continue}
    try{
      const b=await redim(f),path=(id?ps[0].codigo:k)+'.jpg';
      const u=await sb.storage.from('productos').upload(path,b,{upsert:true,contentType:'image/jpeg'});
      if(u.error)throw u.error;
      const url=sb.storage.from('productos').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
      const q=await sb.from('productos').update({foto_url:url}).in('id',ps.map(x=>x.id));
      if(q.error)throw q.error;ok++;
    }catch(e){mal.push(f.name+' ('+(e.message||e)+')')}
  }
  alert('Fotos cargadas: '+ok+(mal.length?'\nNo se pudieron cargar:\n'+mal.join('\n'):''));
  await cargar();render();
}
async function borrarMio(id){
  if(!confirm('¿Eliminar este pedido cancelado?'))return;
  const {error}=await sb.from('pedidos').delete().eq('id',id);
  if(error)return alert(error.message);render();
}
function precio(id){const v=parseFloat(prompt('Nuevo precio con IVA:'));if(v>=0)prodUp(id,{precio:v})}
init();
</script></body></html>
